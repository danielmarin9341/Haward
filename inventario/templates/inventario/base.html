{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventario Hardware{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'inventario/estilos.css' %}?v=20261022-2">
</head>
<body>
  {% if messages %}<div class="messages">{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
